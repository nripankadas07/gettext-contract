[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gettext-contract"
version = "0.1.0"
description = "Checks declared Python percent/brace contracts, plural shapes, fuzzy and untranslated entries."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Dr. Nripanka Das"}]
dependencies = []

[project.urls]
Repository = "https://github.com/nripankadas07/gettext-contract"
Issues = "https://github.com/nripankadas07/gettext-contract/issues"

[project.scripts]
gettext-contract = "gettext_contract:main"

[tool.setuptools]
py-modules = ["gettext_contract"]
